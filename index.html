<html lang="vi" data-theme="light">

<meta name="color-scheme" content="light dark">
<title>Án Mực — Dịch từng chương</title>

<style>
:root{--paper:#f3eee6;--sheet:#faf7f2;--ink:#1c1915;--line:#e3d9cc;--muted:#6f675e;--cin:#9c3b32;--cin-ink:#fff8f6;--cin-soft:#f3e3df;--ok:#3f6b45;--ok-soft:#e5efe3;--warn:#8a5a12;--warn-soft:#f7ecd6;--mark:#f2e2b8;
--sans:"Be Vietnam Pro","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
--serif:"Iowan Old Style",Palatino,"Palatino Linotype","Noto Serif","Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
--zh:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",serif;color-scheme:light}
[data-theme=dark]{--paper:#1a1714;--sheet:#24201b;--ink:#efe8dd;--line:#3a332b;--muted:#a59b8f;--cin:#d0675b;--cin-ink:#1a1714;--cin-soft:#3a2522;--ok:#8fc39a;--ok-soft:#1f2e22;--warn:#e0b467;--warn-soft:#342a19;--mark:#4a3d1c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.serif{font-family:var(--serif)}.zhfont{font-family:var(--serif)}
.topbar{height:4px;background:var(--cin)}
header#hdr{background:var(--sheet);border-bottom:1px solid var(--line);position:relative;z-index:5}
.hwrap{max-width:none;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px;min-height:44px;flex:none;border:1.5px solid var(--cin);color:var(--cin);background:transparent;border-radius:6px;font-family:var(--serif);font-size:24px;line-height:1;padding:0;display:grid;place-items:center;cursor:pointer}
.htitle h1{margin:0;font-family:var(--serif);font-size:1.25rem;font-weight:600;cursor:pointer;line-height:1.2}
.htitle p{margin:0;color:var(--muted);font-size:.85rem;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{display:inline-flex;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px}
.pill button{border:0;background:transparent;border-radius:999px;min-height:38px;min-width:44px;padding:0 12px;font-weight:600;color:var(--muted)}
.pill button.on{background:var(--cin);color:var(--cin-ink)}
.iconbtn{width:44px;height:44px;min-height:44px;padding:0;border-radius:999px;display:grid;place-items:center}
.ic{width:18px;height:18px;vertical-align:-3px;flex:none}
button,.btn{font:inherit;font-size:.92rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:background .15s,border-color .15s}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chitem:focus-visible{outline:2px solid var(--cin);outline-offset:2px}
button.primary{background:var(--cin);border-color:var(--cin);color:var(--cin-ink);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--cin)}
button.small,.btn.small{padding:5px 11px;min-height:34px;font-size:.84rem}
button.link{border:0;background:none;color:var(--cin);text-decoration:underline;padding:2px 4px;min-height:0}
button:disabled{opacity:.5;cursor:not-allowed}
button.wide{width:100%}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-height:42px}
textarea{border-radius:16px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px;font-weight:500}
label.inline{display:flex;align-items:center;gap:8px;color:var(--ink);margin:8px 0;font-weight:400}
label.inline input{width:auto;min-height:0}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row-flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--cin);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px}
.dashed{border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state h3{color:var(--ink);margin:0 0 6px}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
code{font-size:.82em;background:var(--paper);padding:1px 4px;border-radius:4px;word-break:break-all}
mark.term{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px;box-shadow:inset 0 -1px 0 var(--cin)}
/* Trang chủ */
.wrap{max-width:72rem;margin:0 auto;padding:24px 20px 60px}
.intro h2{margin:0 0 6px;font-size:1.6rem}
.intro p{max-width:46rem}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:16px;padding:16px;min-height:120px}
.pcard .pt{font-size:1.15rem;font-weight:600}
.lang{color:var(--cin)}
/* Bàn dịch: Chương | Gốc | Bản Việt */
#mtabs{display:none}
.desk{display:grid;grid-template-columns:16rem 1fr;min-height:calc(100vh - 70px)}
.side{border-right:1px solid var(--line);background:var(--sheet);padding:16px 14px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.ptitle h2{margin:0;font-size:1.1rem;line-height:1.3}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tab{padding:5px 11px;min-height:34px;font-size:.84rem}
.tab.active{background:var(--cin);border-color:var(--cin);color:var(--cin-ink);font-weight:600}
.chhead{display:flex;align-items:center;gap:6px;margin:6px 0 8px}
.chlist{display:flex;flex-direction:column;gap:2px}
.chitem{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:12px;cursor:pointer;border:1px solid transparent;min-height:44px}
.chitem:hover{background:var(--paper)}
.chitem.active{background:var(--paper);border-color:var(--line);box-shadow:inset 3px 0 0 var(--cin)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column}
.chitem .t{font-family:var(--serif);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chitem .meta{font-size:.75rem;color:var(--muted)}
.warnc{color:var(--warn)}
.mvs{display:flex;flex-direction:column;opacity:0;transition:opacity .15s}
.chitem:hover .mvs,.chitem.active .mvs,.chitem:focus-within .mvs{opacity:1}
.mv{border:0;background:none;padding:0 4px;min-height:18px;color:var(--muted)}
.mv .ic{width:14px;height:14px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block;flex:none}
.dot.draft{background:var(--warn);border-color:var(--warn)}
.dot.approved{background:var(--ok);border-color:var(--ok)}
.hint{margin:10px 2px}.legend{margin-top:12px}
.work{min-width:0;padding:16px 20px 60px}
.page-in{max-width:56rem}
.page-in h2{margin:4px 0 10px;font-size:1.4rem}
.ed-head{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.ed-row{display:flex;flex-wrap:wrap;gap:10px}
.fld{margin:0;display:flex;flex-direction:column;gap:3px;min-width:180px}
.fld span{font-size:.78rem}
.fld.grow{flex:1;min-width:240px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.panel h4{margin:0 0 6px;display:flex;align-items:center;gap:6px;font-size:.92rem}
.panel summary{cursor:pointer}
.progress{height:6px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--cin);transition:width .3s}
.joblist{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:260px;overflow:auto}
.jobitem{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.84rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.jobitem select{width:auto;min-height:34px;padding:4px 8px;font-size:.84rem}
.st{font-weight:600}.st.done{color:var(--ok)}.st.run{color:var(--cin)}.st.blocked,.st.error{color:var(--cin)}.st.partial,.st.stopped{color:var(--warn)}.st.omitted{color:var(--muted)}.st.softened{color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:0 7px;font-size:.74rem;margin-left:6px;white-space:nowrap}
.errtxt{color:var(--cin)}.flagtxt{color:var(--warn)}.okc{color:var(--ok)}
.review{white-space:pre-wrap;font-family:var(--serif);font-size:.95rem;max-height:420px;overflow:auto}
.cols-head{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:16px 16px 0 0;background:var(--sheet);position:sticky;top:0;z-index:3}
.colh{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.colh.src{border-right:1px solid var(--line)}
.colh .lab{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:.9rem;min-height:34px}
.colh input{font-size:1.02rem;font-weight:600}
.ttl{display:flex;gap:6px}
.ttl input{flex:1}
details.menu{position:relative;display:inline-block}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:10}
.menu-list button{border-radius:10px;justify-content:flex-start;border-color:transparent}
#rows{border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;background:var(--sheet);overflow:hidden}
.prow{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.flag{background:var(--warn-soft)}
.prow.omit .vi textarea{color:var(--muted);font-style:italic}
.prow .zh{padding:10px 14px;border-right:1px solid var(--line);font-size:1.02rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;position:relative}
.num{color:var(--muted);font-family:var(--sans);font-size:.7rem;margin-right:8px;user-select:none;vertical-align:2px}
.num.m{display:none}
.prow .vi{padding:6px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
textarea.vi{border:1px solid transparent;background:transparent;border-radius:10px;font-size:1.02rem;line-height:1.75;padding:4px 6px;resize:none;overflow:hidden;min-height:38px}
textarea.vi:hover{border-color:var(--line)}
textarea.vi:focus{border-color:var(--cin);background:var(--paper)}
textarea.vi.empty{background:var(--paper)}
.ptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;opacity:.35;transition:opacity .15s}
.prow:hover .ptools,.prow:focus-within .ptools,.ptools:has(.errtxt),.ptools:has(.flagtxt),.ptools:has(.softened){opacity:1}
.ptools button{min-height:28px;padding:2px 9px;font-size:.78rem}
.stats{margin-top:10px;color:var(--muted);font-size:.82rem;white-space:pre-wrap}
.guide{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:10px 0}
.guide ul{margin:4px 0 0;padding-left:18px}
.tablewrap{overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--sheet)}
table.gl{width:100%;border-collapse:collapse}
table.gl th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
table.gl td{padding:4px;border-bottom:1px solid var(--line)}
table.gl input{min-height:36px;padding:6px 8px;border-radius:8px}
.picklist{display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto;padding:8px 14px}
.badge{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.draft{color:var(--warn);border-color:var(--warn)}
.badge.approved{color:var(--ok);border-color:var(--ok)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.pitem .nm{font-weight:600}
/* Hộp thoại & thông báo */
#modal{position:fixed;inset:0;background:rgba(28,25,21,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:50;overflow:auto}
#modal.hidden{display:none}
.mbox{background:var(--sheet);border:1px solid var(--line);border-radius:20px;width:min(760px,100%);padding:18px 20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.mhead h3{margin:0;font-family:var(--serif);font-size:1.2rem;flex:1}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(440px,calc(100vw - 28px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:14px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--cin);color:var(--cin-ink)}
.toast.ok{background:var(--ok);color:#fff}
[data-theme=dark] .toast.ok{color:#10180f}
.printframe{position:fixed;width:0;height:0;border:0;right:0;bottom:0;visibility:hidden}
.desk.page .side{}
/* Luồng tối giản: thanh truyện, hàng đợi, bảng thuật ngữ cạnh bàn dịch */
.desk{grid-template-areas:"pbar pbar" "qbar qbar" "side main";grid-template-rows:auto auto 1fr}
.pbar{grid-area:pbar;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--sheet)}
.pb-t{display:flex;flex-direction:column;min-width:0}
.pb-t h2{margin:0;font-size:1.15rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
button.big{min-height:44px;padding:0 18px;font-size:1rem}
button.on{border-color:var(--cin);color:var(--cin)}
.qbar{grid-area:qbar;padding:0 20px}.qbar[hidden]{display:none}
.qlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:120px;overflow:auto}
.qchip{min-height:30px;padding:2px 10px;font-size:.8rem;border-radius:999px}
.qchip.run{border-color:var(--cin)}
.side{grid-area:side}.work{grid-area:main}
.chk{width:18px;height:18px;min-height:0;margin:0;flex:none;accent-color:var(--cin)}
.chkall{margin:0}
.dot.part{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.dot.run{background:var(--cin);border-color:var(--cin);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 17rem;gap:16px;align-items:start}
.edcol{min-width:0}
.gpanel{position:sticky;top:12px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:12px 14px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.gpanel h4{margin:0 0 4px;font-size:1rem}
.gpanel label{margin-top:6px}
.gph{margin-top:10px}
.gterms{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto}
.gterm{display:grid;grid-template-columns:minmax(4rem,auto) 1fr;gap:6px;align-items:center}
.gterm input{min-height:32px;padding:4px 8px;font-size:.88rem}
.sgbox{border:1px solid var(--warn);border-radius:8px;padding:8px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.sghead{display:flex;align-items:center;gap:6px}
.sglist{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.sgitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 6px;align-items:center;padding-bottom:6px;border-bottom:1px dashed var(--line,#e5ddd0)}
.sgitem:last-child{border-bottom:0}
.sgitem>span{grid-column:1/-1;font-weight:600}
.sgitem .sgnote{grid-column:1/-1;margin-top:-2px}
.sgitem input{width:100%;min-width:0}
.sgitem>*{order:2}.sgitem>span{order:0}.sgitem .sgnote{order:1;margin-top:-4px}
.sgitem input{min-height:32px;padding:4px 8px;font-size:.88rem}
.sgitem button{min-height:30px;padding:2px 9px;font-size:.78rem}
.sgnote{grid-column:1/-1;margin-top:-3px}
.softc{color:var(--warn)}
.blockhint{margin-top:6px}
.qa{display:grid;grid-template-columns:1fr 1fr auto;gap:4px}
.qa input{min-height:34px;padding:4px 8px;font-size:.88rem;min-width:0}
.gptoggle{display:none}
details.adv{margin-top:10px}
details.adv>summary{cursor:pointer;color:var(--muted);font-weight:600;padding:4px 0}
details.chadv{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-top:0}
details.chadv[open]{padding-bottom:12px}
details.chadv .row-flex{margin-top:8px}
.home .setup{border-color:var(--cin);box-shadow:inset 4px 0 0 var(--cin)}
.home .newp input{flex:1}
.sect{margin:22px 0 8px}
.addbox textarea{width:100%}
.advnav{margin-bottom:10px}
.advnav .tabs{margin:0}
.advnav .tabs button{min-height:36px;padding:4px 12px;font-size:.86rem}
.pitem.cur{margin:10px 0;border-color:var(--ok)}
.luout{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.lulist{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--paper)}
.lupre{border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--paper);max-height:220px;overflow:auto}
.lupre p{margin:6px 0}
button.link{border:0;background:none;color:var(--cin);text-decoration:underline;min-height:0;padding:0}
body.dragging::after{content:"⇩";position:fixed;inset:10px;border:3px dashed var(--cin);border-radius:20px;background:rgba(160,40,30,.06);display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--cin);pointer-events:none;z-index:70}

/* Dịch từ + tiêu đề cột + Tải xuống / Chép */
.dirpick span,.colh .fld span{font-size:.8rem;color:var(--muted);font-weight:500}
.dirpick select{font-size:.98rem;min-height:42px;border-color:var(--cin);border-radius:12px}
.dirnote{line-height:1.5}
.colh .fld{min-width:0}
.colh .lab .fbtn{color:var(--cin);text-decoration:none;font-weight:500;gap:4px;display:inline-flex;align-items:center}
.colh.tgt .ttl{margin-top:auto}
.tgthead{gap:8px;position:relative}
.tgtname{font-size:1.22rem;font-weight:600}
.pbtn{background:var(--paper);border:1px solid var(--line);border-radius:999px;min-height:40px;padding:0 14px;font-weight:500;color:var(--ink)}
.pbtn .ic{width:17px;height:17px}
.dlwrap{position:static;display:inline-flex}
.dlmenu{position:absolute;right:0;top:calc(100% + 6px);width:min(330px,88vw);background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:40;font-weight:400}
.dlmenu[hidden]{display:none}
.dlsec{font-size:.8rem;font-weight:600;color:var(--muted);margin-top:2px}
.dlrow{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.dlf{min-height:40px;border-radius:10px;padding:0 6px;font-size:.86rem;font-weight:600}
.dlprint{justify-content:flex-start;border-radius:10px;font-size:.86rem;min-height:38px}
.dlnote{line-height:1.45;margin-top:2px}
.mob-only{display:none!important}
.vi-empty{display:none}
@media (max-width:74.99rem){
  .edgrid{display:flex;flex-direction:column;gap:8px}
  .edgrid .gptoggle{display:inline-flex}
  .gpanel{display:none;position:static;max-height:none;order:-1;width:100%}
  .edgrid.gp-open .gpanel{display:flex}
  .edcol{width:100%}
}
/* Điện thoại: thanh tab Chương | Gốc | Bản Việt như Án Mực */
@media (max-width:47.99rem){
  .hwrap{padding:8px 12px;gap:8px}
  .htitle p{max-width:34vw}
  #saveState{display:none}
  .iconbtn{width:40px;height:40px;min-height:40px}
  .pill button{min-width:40px;padding:0 9px}
  #mtabs{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
  #mtabs[hidden]{display:none}
  #mtabs button{border:0;border-radius:0;background:transparent;min-height:46px;border-bottom:2px solid transparent;color:var(--muted)}
  #mtabs button.on{border-bottom-color:var(--cin);color:var(--cin);font-weight:600}
  .desk{display:block;min-height:0}
  .pbar{padding:10px 12px}.pb-t h2{max-width:none;white-space:normal}
  .pbar .big{flex:1 1 100%}
  .desk:not([data-m=list]) .pbar{display:none}
  .qbar{padding:0 12px}
  .side{position:static;max-height:none;border-right:0;padding:14px}
  .desk:not([data-m=list]) .side{display:none}
  .desk[data-m=list] .work{display:none}
  .work{padding:12px 12px 60px}
  .two{grid-template-columns:1fr}
  .fld{min-width:0;flex:1 1 100%}
  .cols-head,.prow{grid-template-columns:1fr}
  .cols-head{position:static;border-radius:16px 16px 0 0}
  .colh.src{border-right:0}
  .mob-only{display:flex!important}
  .desk[data-m=tgt] .vi-empty{display:flex;align-items:center;min-height:270px;margin-top:12px;padding:24px 28px;border:1.5px dashed var(--line);border-radius:18px;background:var(--sheet);color:var(--muted)}
  .desk[data-m=tgt] #rows.noviyet{display:none}
  .desk[data-m=tgt] .cols-head{border:0;background:transparent}
  .desk[data-m=tgt] .colh.tgt{padding:4px 0}
  .desk[data-m=src] .cols-head{border:0;background:transparent}
  .desk[data-m=src] .colh.src{padding:4px 0 10px;gap:12px}
  .desk[data-m=src] .colh.tgt,.desk[data-m=src] .prow .vi{display:none}
  .desk[data-m=tgt] .colh.src,.desk[data-m=tgt] .prow .zh{display:none}
  .prow .zh{border-right:0}
  .num.m{display:inline}
  .desk[data-m=tgt] .prow .vi{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .desk[data-m=tgt] .prow .vi .num.m{padding-top:12px}
  .desk[data-m=tgt] .prow .vi textarea{flex:1;min-width:0}
  .desk[data-m=tgt] .prow .vi .ptools{flex-basis:100%}
  .ptools{opacity:1}
  .toolbar button{flex:1 1 auto}
  .mvs{opacity:1}
  .menu-list{right:auto;left:0}
  #modal{padding:0}
  .mbox{border-radius:0;min-height:100%;border:0}
}
@media print{header#hdr,.topbar,#mtabs,.side,.ed-head,.toolbar,#toasts{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ú": "{n} entries · CSV has 3 columns: Chinese, Vietnamese, Note", "Bản dịch": "Translation", "Ghi chú": "Note", "Xóa": "Delete", "Chưa có thuật ngữ.": "No terms yet.", "Hướng dẫn văn phong": "Style guide", "Nội dung này được gửi cho AI ở đầu mỗi lần dịch, cùng với lưu ý theo ngôn ngữ nguồn. Bạn có thể sửa tự do theo phong cách của mình.": "This text is sent to the AI at the start of every translation, together with notes for the source language. Edit it freely to your own style.", "Lưu ý theo nguồn": "Notes for the source", "Khôi phục mặc định (tiếng Việt)": "Restore default (Vietnamese)", "Dùng bản mặc định tiếng Anh": "Use the English default", "Tự động lưu.": "Saved automatically.", "Ngôn ngữ đích của dự án:": "Project target language:", "Chưa chọn chương nào.": "No chapters selected.", "Có {n} đoạn chưa dịch trong các chương đã chọn — các đoạn này sẽ bị bỏ qua. Tiếp tục xuất?": "{n} paragraphs in the selected chapters are not translated — they will be skipped. Export anyway?", "Không mở được hộp thoại in.": "Could not open the print dialog.", "Trong hộp thoại in, chọn “Lưu thành PDF”.": "In the print dialog, choose “Save as PDF”.", "Tên sách": "Book title", "Ngôn ngữ của sách": "Book language", "Chọn chương": "Choose chapters", "Chỉ chương đã duyệt": "Approved chapters only", "Chọn tất cả": "Select all", "Bỏ chọn": "Select none", "Chưa có chương.": "No chapters yet.", "Xuất EPUB": "Export EPUB", "PDF (in)": "PDF (print)", "EPUB 3 đọc được trên Apple Books, Google Play Sách, Kobo, Calibre…; gửi tới Kindle qua “Send to Kindle”. Word là tệp .docx thật. PDF mở hộp thoại in của trình duyệt — chọn “Lưu thành PDF”. Chỉ xuất phần bản dịch.": "EPUB 3 works in Apple Books, Google Play Books, Kobo, Calibre…; send to Kindle via “Send to Kindle”. Word is a real .docx file. PDF opens the browser print dialog — choose “Save as PDF”. Only the translation is exported.", "Sao lưu dự án": "Back up project", "Tệp .json chứa toàn bộ chương, bản dịch, thuật ngữ và văn phong (không ch   return HEAD_EN.test(t) || HEAD_VI.test(t) || HEAD_KO.test(t) || HEAD_TH.test(t);

C.splitChapters = text => {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const out = []; const pre = []; let cur = null;
  for (const raw of lines) {
    const t = C.cleanLine(raw); if (!t) continue;
    if (C.isHeading(t)) { cur = { title: t, paras: [] }; out.push(cur); }
    else if (cur) cur.paras.push(t); else pre.push(t);
  }
  if (!out.length) return [{ title: '', paras: pre }];
  if (pre.length) out.unshift({ title: 'Mở đầu', paras: pre });
  const res = []; let carry = '';
  for (const c of out) {
    if (!c.paras.length) { carry = carry ? carry + ' · ' + c.title : c.title; continue; }
    if (carry) { c.title = carry + ' · ' + c.title; carry = ''; }
    res.push(c);
  }
  return res;
};
/* Gom đoạn thành từng phần ~maxChars ký tự, chỉ cắt ở ranh giới đoạn */
C.chunkParagraphs = (zhList, indices, maxChars) => {
  maxChars = maxChars || 1500;
  const chunks = []; let cur = [], len = 0;
  for (const i of indices) {
    const L = (zhList[i] || '').length;
    if (cur.length && len + L > maxChars) { chunks.push(cur); cur = []; len = 0; }
    cur.push(i); len += L;
  }
  if (cur.length) chunks.push(cur);
  return chunks;
};
C.countCJK = s => (String(s || '').match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
C.countWords = s => (String(s || '').trim().match(/\S+/g) || []).length;

/* ---------- Thuật ngữ ---------- */
C.reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* Thuật ngữ chữ Latinh / tiếng Việt (tên Anh, tên Hàn đã Latinh hóa…) chỉ khớp nguyên từ; chữ Hán, Hàn, Thái khớp chuỗi con (không có dấu cách giữa từ). */
const LATIN_EDGE = /[A-Za-z0-9\u00c0-\u024f\u1e00-\u1eff]/;
C.termPattern = t => { t = t.trim(); const e = C.reEsc(t); return (LATIN_EDGE.test(t[0]) ? '(?<![\\p{L}\\p{N}])' : '') + e + (LATIN_EDGE.test(t[t.length - 1]) ? '(?![\\p{L}\\p{N}])' : ''); };
C.termIn = (text, term) => { const t = String(term || '').trim(); if (!t) return false; if (!LATIN_EDGE.test(t[0]) && !LATIN_EDGE.test(t[t.length - 1])) return String(text).includes(t); return new RegExp(C.termPattern(t), 'u').test(text); };
C.findTerms = (text, glossary) => (glossary || []).filter(g => g.zh && g.zh.trim() && C.termIn(text, g.zh));
C.makeHighlighter = glossary => {
  const terms = (glossary || []).filter(g => g.zh && g.zh.trim()).sort((a, b) => b.zh.trim().length - a.zh.trim().length);
  if (!terms.length) return s => C.esc(s);
  const map = new Map(); terms.forEach(t => { if (!map.has(t.zh.trim())) map.set(t.zh.trim(), t); });
  const re = new RegExp('(' + [...map.keys()].map(C.termPattern).join('|') + ')', 'gu');
  return s => String(s).split(re).map((part, k) => {
    if (k % 2 === 1 && map.has(part)) { const t = map.get(part); return '<mark class="term" title="' + C.esc((t.vi || '') + (t.note ? ' — ' + t.note : '')) + '">' + C.esc(part) + '</mark>'; }
    return C.esc(part);
  }).join('');
};
C.viVariants = vi => String(vi || '').split(/[\/|;]/).map(s => s.trim().toLowerCase()).filter(Boolean);
/* Kiểm tra nhất quán: đoạn gốc có thuật ngữ nhưng bản dịch không có cách dịch tương ứng.
   Bỏ qua thuật ngữ 1 ký tự (thường là đại từ như 她/你) vì cách dịch thay đổi theo ngữ cảnh. */
C.consistencyCheck = (paras, glossary) => {
  const terms = (glossary || []).filter(g => g.zh && g.zh.trim().length > 1 && C.viVariants(g.vi).length);
  const issues = [];
  paras.forEach((p, i) => {
    if (!p.vi || !p.vi.trim()) return;
    const vi = p.vi.toLowerCase();
    for (const t of terms) {
      if (C.termIn(p.zh, t.zh) && !C.viVariants(t.vi).some(v => vi.includes(v))) issues.push({ i, zh: t.zh.trim(), vi: t.vi });
    }
  });
  return issues;
};

/* ---------- CSV ---------- */
C.parseCSV = text => {
  text = String(text || '').replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const counts = { ',': (first.match(/,/g) || []).length, ';': (first.match(/;/g) || []).length, '\t': (first.match(/\t/g) || []).length };
  const d = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
};
C.toCSV = rows => '\ufeff' + rows.map(r => r.map(x => { x = String(x == null ? '' : x); return /[",\n\r;]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',')).join('\r\n');
C.glossaryFromCSV = text => {
  const rows = C.parseCSV(text);
  if (rows.length && /trung|chinese|^zh|中文|term|gốc/i.test(rows[0][0] || '')) rows.shift();
  return rows.filter(r => (r[0] || '').trim()).map(r => ({ id: C.uid(), zh: (r[0] || '').trim(), vi: (r[1] || '').trim(), note: (r[2] || '').trim() }));
};
C.glossaryToCSV = g => C.toCSV([['Tiếng Trung', 'Tiếng Việt', 'Ghi chú']].concat((g || []).map(x => [x.zh, x.vi, x.note])));

/* Giải mã tệp .txt: UTF-8 / UTF-16 (có BOM) / GB18030 (GBK) */
C.decodeText = buf => {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b).replace(/^\ufeff/, ''); }
  catch (e) { try { return new TextDecoder('gb18030').decode(b); } catch (e2) { return new TextDecoder('utf-8').decode(b); } }
};


/* Tự nhận ngôn ngữ của chương (cho hướng “Tự nhận”) */
C.detectLang = text => {
  let han = 0, hangul = 0, thai = 0, viet = 0, latin = 0;
  for (const ch of String(text || '').slice(0, 6000)) {
    const c = ch.codePointAt(0);
    if (c >= 0xac00 && c <= 0xd7af) hangul++; else if (c >= 0x0e00 && c <= 0x0e7f) thai++;
    else if (c >= 13312 && c <= 40959) han++; else if (VI_DIA.test(ch)) viet++; else if (/[A-Za-z]/.test(ch)) latin++;
  }
  if (hangul > 20 && hangul >= han) return 'ko';
  if (thai > 20) return 'th';
  if (han > 12 && viet > 12) return 'auto';
  if (han > 12) return /[之乎者也矣焉哉曰兮]/.test(text) && (String(text).match(/[之乎者也矣焉哉曰兮朕卿]/g) || []).length / han > 0.03 ? 'zh-classical' : 'zh-modern';
  if (viet > 12 || (viet >= 3 && viet / (latin + viet) > 0.08)) return 'vi';
  if (latin > 15) return 'en';
  return 'auto';
};

async function copyText(text) {

function suggestHtml() {

  return `<div class="sgbox" id="sgBox"><div class="small gph sghead"><b>${esc(T('Gợi ý thuật ngữ mới ({n})', { n: sg.length }))}</b><span class="spacer"></span><button class="small" data-act="sgAddAll">${esc(T('Thêm tất cả'))}</button></div>
    <div class="muted small">${esc(T('AI đề xuất sau mỗi chương. Sửa cách dịch nếu cần rồi bấm Thêm — chưa thêm thì chưa dùng khi dịch.'))}</div>
    <div class="sglist">${sg.map(x => `<div class="sgitem"><span class="zhfont" title="${esc(x.note || '')}">${esc(x.zh)}</span><input data-sg="${x.id}" value="${esc(x.vi)}" aria-label="${esc(x.zh)}"><button class="small" data-act="sgAdd" data-id="${x.id}">${esc(T('Thêm'))}</button><button class="small link" data-act="sgDismiss" data-id="${x.id}" title="${esc(T('Bỏ gợi ý này'))}">${esc(T('Bỏ'))}</button>${x.note ? `<div class="muted small sgnote">${esc(x.note)}</div>` : ''}</div>`).join('')}</div></div>`;
}
async function addSuggestions(ids) {
  const P = S.project; let n = 0;
  for (const id of ids) {
    const x = (P.termSuggest || []).find(y => y.id === id); if (!x) continue;
    const inp = $('input[data-sg="' + id + '"]'); const vi = ((inp ? inp.value : x.vi) || '').trim(); if (!vi) continue;
    if (!P.glossary.some(g => g.zh === x.zh)) { P.glossary.push({ id: C.uid(), zh: x.zh, vi, note: x.note || '' }); n++; }
    P.termSuggest = P.termSuggest.filter(y => y !== x);
  }
  await saveNow('projects', P); toast(T('Đã thêm {n} thuật ngữ.', { n }), 'ok');
  const sc = $('#main').scrollTop; renderEditor($('#main')); $('#main').scrollTop = sc;
}

/* Dịch một phần (chunk) và cập nhật giao diện */

      signal,
      onRetry: (a, e) => { chunk.msg = T('Thử lại lần {a}…', { a }) + ' (' + e.message.slice(0, 80) + ')'; renderJob(); },
      onPartial: acc => {

  } catch (e) {
    chunk.idx.forEach((i, k) => setViLive(ch, i, snapshot[k]));

    if (res.status === 'blocked' && allowAuto) {
      /* Chính sách khi bị chặn (Cài đặt → Kết nối AI → Nâng cao). “Chỉ báo” giữ cách cũ: ô “Tự động thử lại bằng AI dự phòng” của truyện vẫn có hiệu lực. */
      const pol = allowAuto === 'manual' ? 'report' : blockPolicy(); /* bấm thử lại bằng tay: chỉ theo ô AI dự phòng của truyện như trước */
      const tryFb = pol === 'fallback' || pol === 'fallback_soften' || (pol === 'report' && S.project.autoFallback);
      const trySoft = pol === 'soften' || pol === 'fallback_soften';

        msgs.push('[' + fb.name + '] ' + chunk.msg);
        if (!(trySoft && chunk.status === 'blocked')) { chunk.msg = msgs.join(' | '); renderJob(); return; }
      }
      if (trySoft && last) {
        await runChunkUI(ch, chunk, last, signal, false, true);
        if (chunk.status === 'done' || chunk.status === 'partial') chunk.msg = T('Bị chặn → đã dịch giảm nhẹ bằng {p}.', { p: last.name }) + (chunk.status === 'partial' ? ' ' + chunk.msg : '');

    chunk.softened = !!soften;

/* Hàng đợi: dịch lần lượt nhiều chương, có tiến độ và nút Dừng */

        it.st = 'warn'; it.bad = 1; toast(String(e.message || e), 'err');

      if (it.st !== 'skip' && !ctrl.signal.aborted) {

    S.busy = null; S.queue.running = false;

    S.queue.stopped = ctrl.signal.aborted;
    const bad = S.queue.items.filter(x => x.st === 'warn').length;
    if (ctrl.signal.aborted) toast(T('Đã dừng dịch.'));
    else if (bad) toast(T('{n} chương còn phần bị chặn hoặc lỗi. Mở chương để thử AI khác, “Dịch giảm nhẹ” hoặc “Lược phần này”.', { n: bad }), 'err');

  for (const p of parts) { const h = parasHash(p.paras); if (have.has(h)) { skipped++; continue; } have.add(h); out.push(p); }
  return { parts: out, skipped };
}
function mkChapter(order, p) {
  const ch = { id: C.uid(), projectId: S.project.id, order, title: p.title || (T('Chương') + ' ' + order), titleVi: '', paras: p.paras.map((z, i) => ({ zh: z, vi: (p.vi && p.vi[i]) || '' })), status: 'todo', summary: '', direction: '', address: '', updatedAt: Date.now() };
  if (p.sourceUrl) ch.sourceUrl = p.sourceUrl;
  if (ch.paras.some(x => x.vi)) ch.status = 'draft';
  if (C.detectScript(p.paras.join('\n')) === 'mix' && C.dir(projDir()).source !== 'auto') ch.direction = 'auto-' + projTarget();
  return ch;
}
/* Truyện còn trống và người dùng chưa tự chọn hướng dịch: đoán theo chữ của chương đầu */
async function maybeGuessDirection(parts) {
  const p = S.project; if (S.chapters.length || p.dirTouched || C.dir(p.direction).source === 'auto') return; /* Tự nhận đã tự dò theo chương */
  const g = guessDirection(parts.slice(0, 3).map(x => x.paras.join('\n')).join('\n'));
  if (!g || g === p.direction || C.targetOf(g) !== C.targetOf(p.direction || C.DEFAULT_DIRECTION)) return;
  p.direction = g; await saveNow('projects', p);
}
async function addChapterList(parts, keepOpen, opts) {
  opts = opts || {};
  parts = parts.filter(p => p.paras.length);
  if (!parts.length) { if (!opts.quiet) toast(T('Không tìm thấy đoạn văn nào.'), 'err'); return 0; }
  let skipped = 0;
  if (opts.dedupe) { const d = dedupeParts(parts); parts = d.parts; skipped = d.skipped; }
  if (!parts.length) { toast(T('Bỏ qua {s} chương đã có.', { s: skipped })); return 0; }
  await maybeGuessDirection(parts);
  let order = S.chapters.reduce((a, c) => Math.max(a, c.order), 0);
  let first = null;
  for (const p of parts) { const ch = mkChapter(++order, p); await DB.put('chapters', ch); S.chapters.push(ch); first = first || ch; }
  if (!opts.quiet) toast(T('Đã thêm {n} chương.', { n: parts.length }) + (skipped ? ' ' + T('Bỏ qua {s} chương đã có.', { s: skipped }) : ''), 'ok');
  if (!keepOpen) closeModal();
  if (!S.busy && !opts.stay) { S.chapterId = first.id; S.tab = 'editor'; S.issues = null; S.mtab = 'src'; }
  if ($('#side')) { renderSide(); if (!opts.stay || S.chapters.length === parts.length) renderMain(); renderMTabs(); }
  return parts.length;
}
async function addChaptersFromText(text, split, fallbackTitle, keepOpen) {
  let parts = split ? C.splitChapters(text) : [{ title: '', paras: C.splitParagraphs(text) }];
  parts = parts.map(p => ({ title: p.title || fallbackTitle || '', paras: p.paras }));
  return addChapterList(parts, keepOpen);
}
async function readImport(f) {
  if (f.size > MAX_FILE) throw new Error(T('File lớn hơn 20 MB. Chia nhỏ rồi đưa lại.'));
  return C.importFile(f.name, await f.arrayBuffer());
}
function importWarnings(f, parts) {
  if (C.looksFontLocked(parts.map(p => p.paras.join('\n')).join('\n'))) toast(T('“{f}”: chữ trong file bị vỡ — file khóa chữ bằng font riêng. Cần bản txt UTF-8.', { f: f.name }), 'err', 10000);
}
async function importFilesToProject(files, split) {
  let total = 0;
  for (const f of files) {
    try {
      const imp = await readImport(f);
      const parts = split === false && imp.whole ? [{ title: imp.title, paras: C.splitParagraphs(imp.chapters[0].text) }] : C.chaptersFromImport(imp);
      if (parts.length === 1 && !parts[0].title) parts[0].title = imp.title;
      importWarnings(f, parts);
      total += await addChapterList(parts, true, { dedupe: true });
    } catch (e) { toast(f.name + ': ' + (e.message || e), 'err', 9000); }
  }
  if (total) closeModal();
}
/* Nhập thư mục: mỗi file .txt / .html là một chương (hoặc nhiều chương nếu có dòng tiêu đề), xếp theo tên file 1, 2, …, 10 */
const natCmp = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
async function importFolder(files) {
  const ok = files.filter(f => /\.(txt|md|html?|xhtml)$/i.test(f.name) && !/^\./.test(f.name));
  if (!ok.length) return toast(T('Thư mục không có file .txt hoặc .html nào.'), 'err');
  ok.sort((a, b) => natCmp(a.webkitRelativePath || a.name, b.webkitRelativePath || b.name));
  const all = []; const bad = [];
  for (const f of ok) {
    try {
      if (f.size > MAX_FILE) throw new Error(T('File lớn hơn 20 MB. Chia nhỏ rồi đưa lại.'));
      const base = f.name.replace(/\.[^.]+$/, '').replace(/^\d+[\s._-]+(?=\D)/, '');
      if (/\.(html?|xhtml)$/i.test(f.name)) {
        const r = C.extractReadable(C.decodeHtml(await f.arrayBuffer(), ''), '');
        if (r.paras.length) all.push({ title: r.title || base, paras: r.paras });
      } else {
        const parts = C.chaptersFromImport(await readImport(f));
        if (parts.length === 1 && !parts[0].title) parts[0].title = base;
        parts.forEach(p => all.push(p));
      }
    } catch (e) { bad.push(f.name); }
  }
  if (bad.length) toast(T('Không đọc được: {f}', { f: bad.join(', ') }), 'err', 9000);
  return addChapterList(all, false, { dedupe: true });
}
function guessDirection(sample) {
  const l = C.detectLang(sample);
  if (l === 'ko') return 'ko-vi';
  if (l === 'th') return 'th-vi';
  if (l === 'zh-classical') return 'zh-classical-vi';
  const s = C.detectScript(sample);
  if (s === 'mix') return 'auto-vi';
  if (s === 'han') return 'zh-modern-vi';
  if (s === 'viet') return 'vi-en';
  return /^[\x00-\x7f\s]+$/.test(sample.slice(0, 2000)) ? 'en-vi' : 'auto-vi';
}
async function importNewProject(given) {
  const f = given || (await pickFiles(ACCEPT, false))[0]; if (!f) return;
  let imp; try { imp = await readImport(f); } catch (e) { return toast(e.message || String(e), 'err', 9000); }
  const parts = C.chaptersFromImport(imp); if (!parts.length) return toast(T('Không tìm thấy đoạn văn nào.'), 'err');
  const p = newProjectObj(imp.title || f.name.replace(/\.[^.]+$/, ''), '', C.DEFAULT_DIRECTION); /* “Tự nhận”: ngôn ngữ được dò lại theo từng chương khi dịch */
  await DB.put('projects', p); S.project = p; S.chapters = [];
  importWarnings(f, parts);
  if (parts.length === 1 && !parts[0].title) parts[0].title = imp.title;
  await addChapterList(parts, true);
  openProject(p.id);
}

/* ---------- Nhập từ link (trang chương hoặc trang mục lục) ---------- */
class FetchBlocked extends Error {}
async function fetchPage(url, signal) {
  const px = (S.settings.corsProxy || '').trim();
  const target = px ? (px.includes('{url}') ? px.replace('{url}', encodeURIComponent(url)) : px + url) : url;
  let res;
  try { res = await fetch(target, { signal, credentials: 'omit', redirect: 'follow' }); }
  catch (e) { if (e && e.name === 'AbortError') throw e; throw new FetchBlocked(String(e && e.message || e)); }
  if (!res.ok) throw new Error(T('Trang trả về lỗi {s}.', { s: res.status }) + (res.status === 403 || res.status === 429 ? ' ' + T('Trang có thể chặn đọc tự động hoặc bạn đọc quá nhanh.') : ''));
  const buf = await res.arrayBuffer();
  return C.extractReadable(C.decodeHtml(buf, res.headers.get('content-type')), res.url && !px ? res.url : url);
}
const blockedMsg = () => T('Trang này không cho trình duyệt đọc trực tiếp (chặn CORS — thường gặp khi mở Án Mực từ file trên máy). Cách khác: chép chữ trên trang rồi dán vào ô “Thêm chương”; hoặc lưu trang (Ctrl+S) rồi dùng “Chọn file…”; hoặc tự đặt proxy CORS trong mục Nâng cao bên dưới.');
function openLinkImport() {
  let ctrl = null;
  openModal(T('Nhập từ link'), `
    <div class="note">${esc(T('Dán link một chương, hoặc link trang mục lục để chọn nhiều chương. Chỉ dùng với truyện thuộc phạm vi công cộng hoặc được tác giả cho phép.'))}</div>
    <div class="row-flex" style="flex-wrap:nowrap"><input id="luUrl" type="url" placeholder="https://…" aria-label="${esc(T('Link'))}"><button class="primary" id="luGo">${esc(T('Lấy chữ'))}</button></div>
    <div id="luOut" class="luout"></div>
    <details class="adv"><summary class="small">${esc(T('Proxy CORS (nâng cao)'))}</summary>
      <label for="luProxy">${esc(T('Tiền tố proxy (để trống nếu không dùng)'))}</label><input id="luProxy" placeholder="https://proxy.cua-ban.example/?url={url}" value="${esc(S.settings.corsProxy || '')}">
      <div class="muted small">${esc(T('Link sẽ được nối sau tiền tố, hoặc thay vào chỗ {url}. Dịch vụ proxy của bên thứ ba sẽ thấy mọi trang bạn mở qua nó — chỉ dùng proxy bạn tin cậy hoặc tự dựng.'))}</div></details>`, b => {
    const out = $('#luOut', b);
    $('#luProxy', b).onchange = e => { S.settings.corsProxy = e.target.value.trim(); saveSettings(); };
    const showErr = e => { out.innerHTML = `<div class="note warn" id="luErr">${esc(e instanceof FetchBlocked ? blockedMsg() : (e.message || String(e)))}</div>`; };
    const showToc = (r, url) => {
      out.innerHTML = `<div class="small"><b>${esc(r.title || url)}</b> — ${esc(T('{n} chương tìm thấy', { n: r.links.length }))}</div>
        <div class="row-flex small"><button class="small" id="luAll">${esc(T('Chọn tất cả'))}</button><button class="small" id="luNone">${esc(T('Bỏ chọn'))}</button><button class="small link" id="luThis">${esc(T('Không phải mục lục? Lấy chữ trang này'))}</button></div>
        <div class="lulist">${r.links.map((l, k) => `<label class="inline"><input type="checkbox" class="luSel" data-k="${k}" checked> <span class="zhfont">${esc(l.title)}</span></label>`).join('')}</div>
        <div class="row-flex"><button class="primary" id="luImport">${esc(T('Nhập các chương đã chọn'))}</button><button id="luStop" hidden>${esc(T('Dừng'))}</button><span id="luProg" class="small muted"></span></div>`;
      const upd = () => { $('#luImport', b).textContent = T('Nhập {n} chương đã chọn', { n: $$('.luSel:checked', b).length }); };
      $$('.luSel', b).forEach(x => x.onchange = upd); upd();
      $('#luAll', b).onclick = () => { $$('.luSel', b).forEach(x => x.checked = true); upd(); };
      $('#luNone', b).onclick = () => { $$('.luSel', b).forEach(x => x.checked = false); upd(); };
      $('#luThis', b).onclick = () => showChapter(r, url, true);
      $('#luImport', b).onclick = async () => {
        const pick = $$('.luSel:checked', b).map(x => r.links[+x.dataset.k]); if (!pick.length) return toast(T('Chưa chọn chương nào.'));
        ctrl = new AbortController(); const sig = ctrl.signal; const prog = $('#luProg', b);
        $('#luImport', b).disabled = true; $('#luStop', b).hidden = false; $('#luStop', b).onclick = () => ctrl.abort();
        let added = 0, skipped = 0; const fails = [];
        for (let k = 0; k < pick.length; k++) {
          if (sig.aborted) break;
          prog.textContent = T('Đang lấy {k}/{n}: {t}', { k: k + 1, n: pick.length, t: pick[k].title });
          try {
            const c = await fetchPage(pick[k].url, sig);
            if (!c.paras.length) throw new Error(T('trang trống'));
            const d = dedupeParts([{ title: c.title || pick[k].title, paras: c.paras, sourceUrl: pick[k].url }]);
            if (d.skipped) skipped++; else added += await addChapterList(d.parts, true, { quiet: true, stay: true });
          } catch (e) { if (e && e.name === 'AbortError') break; fails.push(pick[k].title + (e instanceof FetchBlocked ? ' (CORS)' : '')); if (e instanceof FetchBlocked && k === 0) { showErr(e); return; } }
          if (k < pick.length - 1 && !sig.aborted) { try { await C.sleep(window.__linkDelay != null ? window.__linkDelay : 1000, sig); } catch (e) { break; } }
        }
        const msg = T('Đã nhập {a} chương.', { a: added }) + (skipped ? ' ' + T('Bỏ qua {s} chương đã có.', { s: skipped }) : '') + (fails.length ? ' ' + T('Lỗi: {f}', { f: fails.join(', ') }) : '') + (sig.aborted ? ' ' + T('(đã dừng)') : '');
        prog.textContent = msg; $('#luStop', b).hidden = true; $('#luImport', b).disabled = false; ctrl = null;
        toast(msg, fails.length ? 'err' : 'ok');
        if (added) { const first = sortedChapters().find(c => c.sourceUrl === pick[0].url) || sortedChapters()[S.chapters.length - added]; if (first && !S.busy) { S.chapterId = first.id; S.tab = 'editor'; } renderSide(); renderMain(); }
      };
    };
    const showChapter = (r, url, fromToc) => {
      const prev = r.paras.slice(0, 6);
      out.innerHTML = `<div class="small"><b class="zhfont">${esc(r.title || T('(không có tên)'))}</b> · ${fmtN(r.textLen)} ${esc(T('chữ'))} · ${r.paras.length} ${esc(T('đoạn'))}</div>
        <div class="lupre zhfont serif">${prev.map(p => `<p>${esc(p)}</p>`).join('')}${r.paras.length > prev.length ? '<p class="muted">…</p>' : ''}</div>
        <div class="row-flex"><button class="primary" id="luAddOne" ${r.paras.length ? '' : 'disabled'}>${I('plus')} ${esc(T('Thêm chương này'))}</button>
        ${r.links.length >= 2 && !fromToc ? `<button id="luToc">${esc(T('Xem danh sách chương ({n})', { n: r.links.length }))}</button>` : ''}</div>
        ${r.paras.length ? '' : `<div class="note warn">${esc(T('Không tìm thấy chữ chương trên trang này. Hãy chép tay rồi dán vào ô “Thêm chương”.'))}</div>`}`;
      $('#luAddOne', b).onclick = () => addChapterList([{ title: r.title, paras: r.paras, sourceUrl: url }], false, { dedupe: true });
      const t = $('#luToc', b); if (t) t.onclick = () => showToc(r, url);
    };
    const go = async () => {
      let url = $('#luUrl', b).value.trim(); if (!url) return $('#luUrl', b).focus();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      try { new URL(url); } catch (e) { return toast(T('Link không hợp lệ.'), 'err'); }
      out.innerHTML = `<div class="muted small">${esc(T('Đang đọc trang…'))}</div>`;
      try { const r = await fetchPage(url); if (r.isToc) showToc(r, url); else showChapter(r, url); } catch (e) { showErr(e); }
    };
    $('#luGo', b).onclick = go; $('#luUrl', b).onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#luUrl', b).focus();
  }, () => { if (ctrl) ctrl.abort(); });
}

function chapterBook(chs, meta, lang) {
  let untrans = 0;
  const L = C.BOOK_L[lang === 'en' ? 'en' : 'vi'];
  const book = Object.assign({ lang }, meta, { chapters: chs.map((c, k) => { untrans += c.paras.filter(p => !(p.vi && p.vi.trim())).length; return { title: c.titleVi || c.title || (L.chapter + ' ' + (k + 1)), paras: c.paras.map(p => (p.vi || '').trim()).filter(Boolean) }; }) });
  return { book, untrans };
}
function exportBook() {
  const sel = $$('input.exSel:checked').map(i => i.value);
  const chs = sortedChapters().filter(c => sel.includes(c.id));
  if (!chs.length) { toast(T('Chưa chọn chương nào.'), 'err'); return null; }
  const { book, untrans } = chapterBook(chs, { title: $('#exTitle').value.trim() || S.project.title, author: $('#exAuthor').value.trim(), translator: $('#exTrans').value.trim() }, $('#exLang').value);
  if (untrans && !confirm(T('Có {n} đoạn chưa dịch trong các chương đã chọn — các đoạn này sẽ bị bỏ qua. Tiếp tục xuất?', { n: untrans }))) return null;
  return book;
}
function printBook(book) {
  const f = document.createElement('iframe'); f.className = 'printframe'; f.setAttribute('aria-hidden', 'true'); f.title = 'print';
  f.srcdoc = C.buildPrintHtml(book); document.body.appendChild(f);
  f.onload = () => { try { (window.__printHook || (w => w.print()))(f.contentWindow, f); } catch (e) { toast(T('Không mở được hộp thoại in.'), 'err'); } setTimeout(() => f.remove(), 60000); };
  toast(T('Trong hộp thoại in, chọn “Lưu thành PDF”.'));
}

/* PDF thật: vẽ từng trang lên canvas bằng font chữ có chân của trình duyệt (đúng dấu tiếng Việt), rồi gói JPEG thành .pdf */
async function renderPdfPages(book, size) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  const fam = (getComputedStyle(document.documentElement).getPropertyValue('--serif') || '').trim() || 'Georgia, serif';
  const F = C.pdfFonts(size);
  const css = (f, sc) => (f === 'title' || f === 'book' ? '600 ' : '') + (F[f] * sc) + 'px ' + fam;
  const mctx = document.createElement('canvas').getContext('2d');
  const cache = new Map();
  const measure = (t, f) => { const key = f + '\u0001' + t; if (cache.has(key)) return cache.get(key); mctx.font = css(f, 1); const w = mctx.measureText(t).width; cache.set(key, w); return w; };
  const lay = C.pdfLayout(book, measure, { size });
  const sc = 2.4; const cw = Math.round(lay.W * sc), chh = Math.round(lay.H * sc);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = chh; const ctx = cv.getContext('2d');
  const out = [];
  for (let i = 0; i < lay.pages.length; i++) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, chh); ctx.fillStyle = '#1c1915'; ctx.textBaseline = 'alphabetic';
    for (const op of lay.pages[i].ops) {
      if (op.k === 'seal') { const z = op.size * sc; ctx.strokeStyle = '#9c3b32'; ctx.lineWidth = 1.2 * sc; ctx.strokeRect(op.x * sc - z / 2, op.y * sc - z / 2, z, z); ctx.fillStyle = '#9c3b32'; ctx.font = (z * 0.55) + 'px ' + fam; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('墨', op.x * sc, op.y * sc + z * 0.03); ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#1c1915'; continue; }
      ctx.font = css(op.font, sc); ctx.fillStyle = op.font === 'small' ? '#6b6258' : '#1c1915';
      if (op.k === 'just') {
        const ws = op.words.map(w => measure(w, op.font)); const sum = ws.reduce((a, b) => a + b, 0); const sp = measure(' ', op.font);
        let gap = (op.w - sum) / (op.words.length - 1); if (gap > sp * 3) gap = sp;
        ctx.textAlign = 'left'; let x = op.x; op.words.forEach((w, k) => { ctx.fillText(w, x * sc, op.y * sc); x += ws[k] + gap; });
      } else { ctx.textAlign = op.align === 'center' ? 'center' : 'left'; ctx.fillText(op.s, op.x * sc, op.y * sc); }
    }
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86));
    out.push({ jpeg: new Uint8Array(await blob.arrayBuffer()), pw: cw, ph: chh });
    if (i % 8 === 7) await new Promise(r => setTimeout(r, 0));
  }
  return { lay, pages: out };
}
async function downloadPdf(book, base) {
  toast(T('Đang tạo PDF…'));
  const { lay, pages } = await renderPdfPages(book, 'A5');
  const bytes = C.buildPdf(pages, lay.W, lay.H, { title: book.title, author: book.author || '' });
  download(base + '.pdf', new Blob([bytes], { type: 'application/pdf' }));
  toast(T('Đã tạo PDF ({n} trang).', { n: pages.length }), 'ok');
}

    if (typed !== 'XOA') return;
    for (const c of S.chapters) await DB.del('chapters', c.id); await DB.del('projects', p.id); toast(T('Đã xóa truyện.')); goHome();
  },
  addProfile: () => { const k = $('#presetSel').value; openProfileForm(Object.assign({ id: '', apiKey: '', temperature: 0.7, stream: true, safety: '' }, C.PRESETS[k], { name: T(C.PRESETS[k].name) })); },
  editProfile: el => openProfileForm(getProfile(el.dataset.id)),
  delProfile: el => {
    const p = getProfile(el.dataset.id); if (!confirm(T('Xóa hồ sơ “{n}” (kèm khóa API)?', { n: p.name }))) return;
    S.settings.profiles = S.settings.profiles.filter(x => x.id !== p.id);
    if (S.settings.defaultProfileId === p.id) S.settings.defaultProfileId = S.settings.profiles[0] ? S.settings.profiles[0].id : '';
    if (S.settings.fallbackProfileId === p.id) S.settings.fallbackProfileId = '';
    saveSettings(); openSettings();
  },
  testProfile: el => testProfile(el.dataset.id)
};
document.addEventListener('click', e => {
  if (e.target.matches && e.target.matches('input.chk')) return; /* ô chọn chương: để trình duyệt tự đánh dấu */
  if (!(e.target.closest && e.target.closest('.dlwrap'))) closeDlMenu();
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(el, e)).catch(err => { console.error(err); toast(T('Lỗi: ') + (err && err.message || err), 'err'); }); }
});
document.addEventListener('input', e => {
  const t = e.target; const ch = curCh();
  if (t.matches('textarea.vi') && ch) { const p = ch.paras[Number(t.dataset.i)]; p.vi = t.value; delete p.omitted; autosize(t); scheduleSave('chapters', ch); clearTimeout(timers._st); timers._st = setTimeout(updateStats, 300); }
  else if (t.dataset.cf && ch && t.tagName !== 'SELECT') { ch[t.dataset.cf] = t.value; scheduleSave('chapters', ch); if (t.dataset.cf === 'title' || t.dataset.cf === 'titleVi') { clearTimeout(timers._sd); timers._sd = setTimeout(renderSide, 500); } }
  else if (t.dataset.sg && S.project) { const x = (S.project.termSuggest || []).find(y => y.id === t.dataset.sg); if (x) { x.vi = t.value; scheduleSave('projects', S.project); } }
  else if (t.dataset.g && S.project) { const g = S.project.glossary.find(x => x.id === t.dataset.id); if (g) { g[t.dataset.g] = t.value; scheduleSave('projects', S.project); } }
  else if (t.dataset.pf && S.project && t.type !== 'checkbox' && t.tagName !== 'SELECT') { S.project[t.dataset.pf] = t.value; scheduleSave('projects', S.project); if (t.dataset.pf === 'title') { const c = $('#crumb'); if (c) c.textContent = t.value; clearTimeout(timers._sd); timers._sd = setTimeout(renderPbar, 500); } }
});
document.addEventListener('change', async e => {
  const t = e.target; const ch = curCh();
  if (t.matches('input.chk')) {
    const id = t.dataset.id;
    if (id === '*') { S.sel = t.checked ? new Set(S.chapters.map(c => c.id)) : new Set(); renderSide(); }
    else { if (t.checked) S.sel.add(id); else S.sel.delete(id); renderPbar(); const all = $('input.chk[data-id="*"]'); if (all) all.checked = S.chapters.length && S.chapters.every(c => S.sel.has(c.id)); }
    return;
  }
  if (t.dataset.cf === 'status' && ch) { ch.status = t.value; saveNow('chapters', ch); renderSide(); }
  else if (t.dataset.cf === 'direction' && ch) { ch.direction = t.value; await saveNow('chapters', ch); renderSide(); renderEditor($('#main')); }
  else if (t.dataset.pf === 'direction' && S.project) { await setProjDir(t.value); renderSide(); if (curCh() && $('#rows')) renderEditor($('#main')); }
  else if (t.dataset.pf && S.project && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
    S.project[t.dataset.pf] = t.type === 'checkbox' ? t.checked : t.value;
    await saveNow('projects', S.project);
  }
});
/* Bôi đen chữ ở cột Gốc → điền sẵn vào ô “Thêm nhanh” thuật ngữ */
document.addEventListener('mouseup', e => {
  if (!e.target.closest || !e.target.closest('.prow .zh')) return;
  const s = String(window.getSelection() || '').trim(); const q = $('#qaZh');
  if (s && q && s.length <= 40) { q.value = s; if (!S.gpOpen && window.innerWidth < 1200) A.gpToggle(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); const ch = curCh(); if (ch) saveNow('chapters', ch); if (S.project) saveNow('projects', S.project); toast(T('Đã lưu.')); }
  if (e.key === 'Escape' && $('#dlMenu') && !$('#dlMenu').hidden) { closeDlMenu(); const b = $('#dlBtn'); b && b.focus(); return; }
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.chitem')) { e.preventDefault(); e.target.click(); }
});
/* Kéo thả file: ở trang chủ → truyện mới (hoặc nhập .json sao lưu); trong truyện → thêm chương */
let dragN = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragN++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) document.body.classList.remove('dragging'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', async e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; document.body.classList.remove('dragging');
  const files = Array.from(e.dataTransfer.files || []); if (!files.length) return;
  if (S.project) { const many = files.length > 1 && files.every(f => /\.(txt|md|html?|xhtml)$/i.test(f.name)); return many ? importFolder(files) : importFilesToProject(files, true); }
  if (/\.json$/i.test(files[0].name)) return importBackup(files[0]);
  return importNewProject(files[0]);
});
window.addEventListener('beforeunload', e => { if (pending.size || S.busy) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Khởi động ---------- */
(async function init() {
  C.lang = UI;
  const th = localStorage.getItem('dichtruyen_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;
  renderHeader();
  try { await DB.open(); } catch (e) { $('#app').innerHTML = '<div class="wrap"><div class="sheet">' + esc(T('Không mở được bộ nhớ trình duyệt (IndexedDB). Hãy dùng Chrome bản mới và không ở chế độ ẩn danh.')) + '</div></div>'; return; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const last = localStorage.getItem('dichtruyen_last');
  const ps = await DB.all('projects');
  if (last && ps.some(p => p.id === last)) openProject(last); else goHome();
})();
window.__app = { S, DB, A, T };
})();
</script>
